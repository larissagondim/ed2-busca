name: Deploy Backend no Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/deploy-render.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Disparar deploy no Render
        run: |
          curl --request POST \
            --url "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}" \
            --header 'content-type: application/json'

      - name: Aguardar build
        run: |
          echo "Deploy disparado no Render"
          echo "Acompanhe em: https://dashboard.render.com/services"
