name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '26', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Validar especificações
        run: test -s docs/specs/catalogo-api.md && test -s docs/specs/frontend.md && test -s docs/adr/0001-arquitetura-local.md
      - name: Build, testes e coberturas
        run: ./mvnw --batch-mode verify
      - name: Instalar navegador Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Executar JAR e testes ponta a ponta
        run: |
          WIKIART_CATALOGO=src/test/resources/catalogo-fixture.csv java -jar target/wikiart-catalogo-*.jar &
          echo $! > /tmp/wikiart.pid
          cd frontend && npx playwright test
          kill $(cat /tmp/wikiart.pid)
      - name: Detectar geração não versionada
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-de-testes
          path: |
            target/surefire-reports
            target/site/jacoco
            frontend/coverage
            frontend/playwright-report
