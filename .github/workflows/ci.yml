name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validar especificações
        run: |
          test -s docs/specs/catalogo-api.md
          test -s docs/specs/frontend.md
          test -s docs/adr/0001-arquitetura-local.md

      - name: Build, testes e coberturas
        run: ./mvnw --batch-mode verify

      - name: Instalar navegador Playwright
        working-directory: frontend
        env:
          DEBUG: pw:install
        run: npx playwright install --with-deps chromium

      - name: Executar JAR e testes ponta a ponta
        run: |
          WIKIART_CATALOGO=src/test/resources/catalogo-fixture.csv \
            java -jar target/wikiart-catalogo-*.jar &

          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for tentativa in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/; then
              break
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "A aplicação encerrou antes de ficar disponível."
              wait "$app_pid"
              exit 1
            fi

            if [ "$tentativa" -eq 60 ]; then
              echo "A aplicação não ficou disponível em 60 segundos."
              exit 1
            fi

            sleep 1
          done

          cd frontend
          npx playwright test

      - name: Detectar geração não versionada
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-de-testes
          path: |
            target/surefire-reports
            target/site/jacoco
            frontend/coverage
            frontend/playwright-report
